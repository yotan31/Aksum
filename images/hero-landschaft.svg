<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Eritreische Landschaft mit Tafelbergen, Akazie und Kamel">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7eedf"/>
      <stop offset="0.55" stop-color="#f3dcbc"/>
      <stop offset="1" stop-color="#ecc597"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c56f" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#eeb45a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#eeb45a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0704a"/>
      <stop offset="1" stop-color="#8a4c2f"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e3a24"/>
      <stop offset="1" stop-color="#4f2817"/>
    </linearGradient>
  </defs>

  <!-- Himmel -->
  <rect width="1600" height="600" fill="url(#sky)"/>

  <!-- Sonne -->
  <circle cx="1010" cy="300" r="190" fill="url(#sun)"/>
  <circle cx="1010" cy="300" r="62" fill="#f2bd63" opacity="0.9"/>

  <!-- Ferne Tafelberge (Hochland) -->
  <path fill="#e2bb92" opacity="0.75" d="M0,360 L60,350 L110,318 L250,316 L290,340 L380,346 L430,300 L470,292 L600,294 L640,322 L720,330 L790,312 L860,310 L900,336 L1000,340 L1060,298 L1110,288 L1250,290 L1290,318 L1380,326 L1430,304 L1530,302 L1600,322 L1600,600 L0,600 Z"/>

  <!-- Mittlere Hügel -->
  <path fill="#cf9a6c" d="M0,398 C120,380 220,372 330,384 C430,394 500,370 600,366 C700,362 760,388 870,392 C980,396 1060,372 1170,368 C1290,364 1380,390 1480,388 C1540,386 1580,380 1600,378 L1600,600 L0,600 Z"/>

