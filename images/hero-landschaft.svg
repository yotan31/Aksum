  </g>
  <ellipse cx="877" cy="446" rx="46" ry="3" fill="#6e3a24" opacity="0.35"/>

  <!-- Schirmakazie -->
  <g transform="translate(1150,452)" fill="#3b2216">
    <path d="M-4,0 C-3,-30 -8,-62 -30,-92 L-24,-95 C-6,-74 0,-54 1,-34 C5,-56 18,-78 38,-94 L43,-90 C22,-72 9,-46 5,0 Z"/>
