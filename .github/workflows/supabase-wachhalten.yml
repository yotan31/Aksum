# Hält die kostenlose Supabase-Datenbank wach (sie pausiert sonst nach 7 Tagen ohne Zugriff).
# Läuft täglich kostenlos auf GitHub. Liest Adresse und öffentlichen Schlüssel aus js/config.js.
name: Supabase wach halten
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank anpingen
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]*' js/config.js || true)
          KEY=$(grep -oP 'supabaseAnonKey:\s*"\K[^"]*' js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase noch nicht eingetragen – nichts zu tun."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo " – Datenbank ist wach."
